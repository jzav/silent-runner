name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Windows MinGW-w64
    runs-on: windows-latest

    permissions:
      contents: read

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          pacboy: >-
            toolchain:p
            cmake:p

      - name: Configure
        run: >
          cmake -S . -B build
          -G "MinGW Makefiles"
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Upload release binary
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: SilentRunner
          path: build/SilentRunner.exe

  release:
    name: Release
    needs: build-and-test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Download tested binary
        uses: actions/download-artifact@v4
        with:
          name: SilentRunner
          path: release

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          "release/SilentRunner.exe#SilentRunner.exe"
          --verify-tag
          --generate-notes
          --title "${{ github.ref_name }}"